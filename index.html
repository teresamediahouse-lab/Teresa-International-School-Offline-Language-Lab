<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teresa International School Language Lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fb;color:#18324b;font:15px Arial,sans-serif}header{background:#123c70;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:20px;margin:0}main{max-width:1100px;margin:24px auto;padding:0 14px}.panel{background:white;border:1px solid #d8e3ee;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 4px 16px #17324b0a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.layout{display:grid;grid-template-columns:190px 1fr;gap:14px}.side{background:#123c70;border-radius:12px;padding:10px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent;color:white;margin:4px 0}.side button.active{background:#0878df}button{border:0;border-radius:8px;padding:10px 13px;background:#0878df;color:white;font-weight:bold;cursor:pointer;margin:3px}button.alt{background:#e8f1fc;color:#123c70}button.danger{background:#fff0f0;color:#a11}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd8e5;border-radius:8px;margin:5px 0 12px;font:inherit}label{font-size:12px;font-weight:bold;display:block;color:#5b6f83}.muted{font-size:13px;color:#64788c;line-height:1.55}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}.tabs .active{background:#123c70}.badge{display:inline-block;border-radius:20px;background:#e6f2ff;color:#164e85;padding:6px 10px;font-size:12px;margin:3px}.stat{font-size:30px;font-weight:bold;color:#123c70}.passage{background:#f4f8ff;padding:14px;border-radius:9px;line-height:1.8}.question{border:1px solid #dce6ef;border-radius:10px;padding:12px;margin:10px 0}.opt{display:block;background:#f5f8fc;padding:8px;border-radius:6px;margin:5px 0}.opt input{width:auto;margin:0 8px 0 0}.notice{background:#fff7df;border:1px solid #efdfa9;border-radius:9px;padding:12px;font-size:12px;line-height:1.5}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid #e2eaf2}.scroll{overflow:auto}.hide{display:none}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:flex;flex-wrap:wrap}.side button{width:auto}.hero{grid-template-columns:1fr}}
</style></head><body><header><div><h1>📚 Teresa International School</h1><div style="font-size:12px;color:#dceaff;margin-top:5px">Offline Language Lab · English · Hindi · Sanskrit · Classes 6–12</div></div><div id="session">Welcome</div></header><main id="app"></main>
<script>
(function(){
"use strict";
const STORE="teresa_lab_working_v1";
const initial={
 teachers:[{username:"teacher",password:"teacher123",name:"School Administrator",role:"admin"}],
 students:[], assignments:[], results:[], next:1,
 words:[
 {id:1,subject:"English",cls:"6",level:"Beginner",word:"curious",meaning:"eager to know or learn",example:"The curious child asked a question.",pron:"KYUR-ee-us"},
 {id:2,subject:"English",cls:"6",level:"Beginner",word:"kindness",meaning:"being friendly and caring",example:"Kindness makes our school better.",pron:"KIND-ness"},
 {id:3,subject:"Hindi",cls:"6",level:"Beginner",word:"परिश्रम",meaning:"मेहनत; कठिन प्रयास",example:"परिश्रम से सफलता मिलती है।",pron:"pa-ri-shram"},
 {id:4,subject:"Hindi",cls:"6",level:"Beginner",word:"विद्यालय",meaning:"पढ़ने की जगह",example:"मेरा विद्यालय सुंदर है।",pron:"vid-yaa-lay"},
 {id:5,subject:"Sanskrit",cls:"6",level:"Beginner",word:"पुस्तकम्",meaning:"book; पुस्तक",example:"एतत् पुस्तकम् अस्ति।",pron:"pus-ta-kam"},
 {id:6,subject:"Sanskrit",cls:"6",level:"Beginner",word:"नमस्ते",meaning:"greetings; अभिवादन",example:"नमस्ते मित्र।",pron:"na-mas-te"}
 ],
 lessons:[
 {subject:"English",cls:"6",title:"The Value of Kindness",passage:"Kindness is a simple act that can make a big difference. When we are kind, we help others and create a happier world. Sharing and helping can bring a smile to someone's face.",qs:[["What can kindness create?",["A happier world","A storm","A new road"],0],["Which action shows kindness?",["Sharing with someone","Ignoring a friend","Shouting at others"],0]]},
 {subject:"Hindi",cls:"6",title:"मेरा विद्यालय",passage:"मेरा विद्यालय बहुत सुंदर है। यहाँ सभी शिक्षक हमें प्रेम से पढ़ाते हैं। हम प्रतिदिन कुछ नया सीखते हैं और मिलकर रहते हैं।",qs:[["विद्यालय कैसा है?",["सुंदर","गंदा","बंद"],0],["हमें कौन पढ़ाते हैं?",["शिक्षक","किसान","डाकिया"],0]]},
 {subject:"Sanskrit",cls:"6",title:"सरल संस्कृत",passage:"रामः छात्रः अस्ति। सीता छात्रा अस्ति। छात्राः पुस्तकानि पठन्ति।",qs:[["रामः कः अस्ति?",["छात्रः","वृक्षः","फलम्"],0],["छात्राः किं पठन्ति?",["पुस्तकानि","फलानि","जलं"],0]]}
 ]};
let db;try{db=JSON.parse(localStorage.getItem(STORE))||initial}catch(e){db=initial}
const app=document.getElementById("app"),session=document.getElementById("session");
let current=null,subject="English",level="Beginner",currentAssignment=null;
const subjects=["English","Hindi","Sanskrit"],classes=["6","7","8","9","10","11","12"],levels=["Beginner","Medium","Hard"];
const $=id=>document.getElementById(id), val=id=>$(id)?$(id).value:"";
const esc=x=>String(x==null?"":x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){alert("The browser could not save your data. Export a backup and use the same browser and app location.");return false}}
function options(id,arr,selected){return '<select id="'+id+'">'+arr.map(x=>'<option value="'+esc(x)+'" '+(String(x)===String(selected)?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select>'}
function field(label,id,placeholder,type="text"){return '<label>'+label+'</label><input id="'+id+'" type="'+type+'" placeholder="'+placeholder+'">'}
function login(mode="student"){
 current=null;session.textContent="Student & Teacher Login";
 app.innerHTML='<div class="grid"><section class="panel"><span class="badge">Classes 6–12</span><span class="badge">Works offline</span><h2 style="font-size:30px;color:#123c70">Learn today. Lead tomorrow.</h2><p class="muted">Build vocabulary and practise reading, listening, speaking and pronunciation in three languages.</p><div class="grid"><div class="panel">📖 <b>Reading</b><p class="muted">Read passages and answer questions.</p></div><div class="panel">🎧 <b>Listening</b><p class="muted">Listen to a passage and respond.</p></div><div class="panel">🎙️ <b>Speaking</b><p class="muted">Practise saying words aloud.</p></div></div><div class="notice">Offline note: accounts and scores are stored in this browser on this computer. They do not sync to other computers.</div></section><section class="panel"><h2>Welcome</h2><div class="tabs"><button id="studentTab" class="'+(mode==="student"?"active":"alt")+'">Student login</button><button id="teacherTab" class="'+(mode==="teacher"?"active":"alt")+'">Teacher login</button></div><div id="form"></div><p class="muted">School administrator (first login): <b>teacher</b> / <b>teacher123</b>. Use Teacher accounts to create separate teacher logins.</p><p id="error" style="color:#b42318"></p></section></div>';
 $("studentTab").onclick=()=>login("student");$("teacherTab").onclick=()=>login("teacher");
 if(mode==="teacher"){
 $("form").innerHTML=field("Username","username","Teacher username")+field("Password","password","Password","password")+'<button id="go">Log in</button>';
 $("go").onclick=()=>{let t=db.teachers.find(x=>x.username===val("username")&&x.password===val("password"));if(!t){$("error").textContent="Login failed. Try teacher / teacher123.";return}current={role:"teacher",id:t.id||t.username,name:t.name,username:t.username,admin:t.role==="admin"||t.username==="teacher"};teacherPage("home")};
 }else{
 $("form").innerHTML=field("Username","username","Student username")+field("Password","password","Password","password")+'<button id="go">Log in as student</button><hr><h3>Create student account</h3>'+field("Full name","fullname","Student full name")+'<label>Class</label>'+options("newclass",classes,"6")+field("New username","newuser","Choose username")+field("New password","newpass","At least 4 characters","password")+'<button class="alt" id="register">Create account</button>';
 $("go").onclick=()=>{let s=db.students.find(x=>x.username===val("username")&&x.password===val("password"));if(!s){$("error").textContent="Login failed. Check your details or create an account.";return}current={role:"student",id:s.id,name:s.name};studentPage("home")};
 $("register").onclick=()=>{let name=val("fullname").trim(),u=val("newuser").trim(),p=val("newpass");if(!name||!u||p.length<4){$("error").textContent="Enter your name, username and a password of at least 4 characters.";return}if(db.students.some(x=>x.username.toLowerCase()===u.toLowerCase())){$("error").textContent="Username already exists on this computer.";return}let s={id:db.next++,name,username:u,password:p,cls:val("newclass")};db.students.push(s);save();current={role:"student",id:s.id,name:s.name};studentPage("home")};
 }
}
function student(){return db.students.find(s=>s.id===current.id)}
function shell(role,active,title,content){
 let nav=role==="teacher"?[["home","Dashboard"],...(current.admin?[["teachers","Teacher accounts"]]:[]),["students","Students"],["lessons","Lesson editor"],["assign","Assignments"],["words","Word manager"],["reports","Progress reports"]]:[["home","Dashboard"],["learn","Learning studios"],["words","Vocabulary"],["assign","My assignments"],["reports","My progress"]];
 session.textContent=(role==="teacher"?"Teacher: ":"Student: ")+current.name;
 app.innerHTML='<div class="layout"><aside class="side">'+nav.map(n=>'<button class="'+(active===n[0]?"active":"")+'" data-page="'+n[0]+'">'+n[1]+'</button>').join("")+'<button id="logout">↪ Log out</button></aside><section><h2>'+esc(title)+'</h2>'+content+'</section></div>';
 app.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>role==="teacher"?teacherPage(b.dataset.page):studentPage(b.dataset.page));$("logout").onclick=()=>login();
}
function teacherPage(page){
 if(page==="home")shell("teacher",page,"Teacher dashboard",'<div class="grid">'+stat("Student accounts",db.students.length)+stat("Teacher accounts",db.teachers.length)+stat("Assignments",db.assignments.length)+stat("Test submissions",db.results.length)+'</div><div class="panel"><h3>Welcome, '+esc(current.name)+'</h3><p class="muted">Use Word manager to add vocabulary, Assignments to set classwork, and Progress reports to review results.</p><p class="notice">Saved on this browser and computer. Always open the same app copy in the same browser. Use the backup option in reports regularly. This offline version does not sync between computers.</p></div>');
 if(page==="teachers"&&current.admin){shell("teacher",page,"Manage teacher accounts",'<div class="panel"><h3>Create a teacher login</h3>'+field("Teacher full name","tname","Full name")+field("Username","tuser","Unique username")+field("Password","tpass","At least 6 characters","password")+'<button id="addteacher">Create teacher account</button><p id="teachermsg" class="muted"></p></div><div class="panel"><h3>Existing teacher logins</h3><div class="scroll"><table><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr>'+db.teachers.map(t=>'<tr><td>'+esc(t.name)+'</td><td>'+esc(t.username)+'</td><td>'+(t.role==="admin"||t.username==="teacher"?"Administrator":"Teacher")+'</td><td>'+(t.username==="teacher"?"Protected admin account":'<button class="danger" data-delteacher="'+esc(t.username)+'">Delete</button>')+'</td></tr>').join("")+'</table></div></div>');$("addteacher").onclick=()=>{let name=val("tname").trim(),u=val("tuser").trim(),pw=val("tpass");if(!name||!u||pw.length<6){$("teachermsg").textContent="Enter a name, username and password of at least 6 characters.";return}if(db.teachers.some(t=>t.username.toLowerCase()===u.toLowerCase())||db.students.some(t=>t.username.toLowerCase()===u.toLowerCase())){$("teachermsg").textContent="That username is already in use.";return}db.teachers.push({id:db.next++,name,username:u,password:pw,role:"teacher"});save();teacherPage("teachers")};app.querySelectorAll("[data-delteacher]").forEach(b=>b.onclick=()=>{if(confirm("Delete this teacher login? Existing reports and assignments will remain.")){db.teachers=db.teachers.filter(t=>t.username!==b.dataset.delteacher);save();teacherPage("teachers")}})}
 if(page==="students"){let rows=db.students.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.username)+'</td><td>'+s.cls+'</td><td>'+db.results.filter(r=>r.sid===s.id).length+'</td></tr>').join("");shell("teacher",page,"Student accounts",'<div class="panel scroll">'+(rows?'<table><tr><th>Name</th><th>Username</th><th>Class</th><th>Tests</th></tr>'+rows+'</table>':'No student accounts yet. Ask students to register.')+'</div>')}
 if(page==="assign"){shell("teacher",page,"Create assignments",'<div class="panel"><label>Assignment title</label><input id="at" placeholder="e.g. English reading practice"><div class="grid"><div><label>Subject</label>'+options("as",subjects,"English")+'</div><div><label>Class</label>'+options("ac",classes,"6")+'</div><div><label>Level</label>'+options("al",levels,"Beginner")+'</div><div><label>Activity</label>'+options("aa",["Reading","Listening","Speaking","Vocabulary","Final test"],"Reading")+'</div></div><label>Reading / listening passage or teacher instructions</label><textarea id="acontent" rows="4" placeholder="Write the passage or instructions students should use"></textarea><label>Speaking / vocabulary target words (one word or phrase per line)</label><textarea id="awords" rows="3" placeholder="curious&#10;kindness&#10;your own words"></textarea><label>Assign to</label>'+options("target",["Entire class",...db.students.map(s=>s.name+" (Class "+s.cls+")")],"Entire class")+'<button id="create">Create assignment</button><div id="msg"></div></div><div class="panel"><h3>Existing assignments</h3>'+ (db.assignments.map(a=>'<p><b>'+esc(a.title)+'</b> — '+esc(a.subject)+', Class '+a.cls+', '+esc(a.activity)+(a.teacher?' · set by '+esc(a.teacher):'')+'</p>'+(a.content?'<p>'+esc(a.content.slice(0,160))+'</p>':'')+'</div>').join("")||"No assignments yet.")+'</div>');$("create").onclick=()=>{if(!val("at").trim()){$("msg").textContent="Please enter a title.";return}db.assignments.push({id:db.next++,title:val("at"),subject:val("as"),cls:val("ac"),level:val("al"),activity:val("aa"),target:val("target"),content:val("acontent").trim(),words:val("awords").split(/\n/).map(x=>x.trim()).filter(Boolean),teacher:current.name});save();teacherPage("assign")}}
 if(page==="lessons"){
 shell("teacher",page,"Lesson editor — create your own class content",'<div class="panel"><p class="muted">Create or replace the passage for a subject and class. The passage is used for reading and listening. Add a word bank for speaking and vocabulary.</p><div class="grid"><div><label>Subject</label>'+options("ls",subjects,"English")+'</div><div><label>Class</label>'+options("lc",classes,"6")+'</div><div><label>Lesson title</label><input id="lt" placeholder="Lesson title"></div></div><label>Reading / listening passage</label><textarea id="lp" rows="6" placeholder="Write your own passage here"></textarea><label>Vocabulary / speaking words (one per line)</label><textarea id="lw" rows="4" placeholder="word | meaning | example sentence | pronunciation hint"></textarea><p class="muted">For each word, enter: word | meaning | example sentence | pronunciation hint. You can also use just a word.</p><button id="savelesson">Save lesson for this class</button><div id="lessonmsg" class="muted"></div></div><div class="panel"><h3>Saved lessons</h3><div class="scroll">'+(db.lessons.map(l=>'<p><b>'+esc(l.subject)+' · Class '+esc(l.cls)+': '+esc(l.title)+'</b><br><span class="muted">'+esc(l.passage.slice(0,110))+'…</span></p>').join('')||'No saved lessons yet.')+'</div></div>');
 $("savelesson").onclick=()=>{let sub=val("ls"),cls=val("lc"),title=val("lt").trim(),passage=val("lp").trim();if(!title||!passage){$("lessonmsg").textContent="Please enter a lesson title and passage.";return}let qs=[["What is the main idea of this passage?",["The passage above","A different topic","Not mentioned"],0]];let existing=db.lessons.find(l=>l.subject===sub&&l.cls===cls);let item={subject:sub,cls,title,passage,qs};if(existing)Object.assign(existing,item);else db.lessons.push(item);let lines=val("lw").split(/\n/).map(x=>x.trim()).filter(Boolean);db.words=db.words.filter(w=>!(w.subject===sub&&String(w.cls)===String(cls)&&w.lessonTitle));lines.forEach(line=>{let parts=line.split("|").map(x=>x.trim());db.words.push({id:db.next++,subject:sub,cls,level:"Beginner",word:parts[0],meaning:parts[1]||"Teacher-added word",example:parts[2]||"",pron:parts[3]||"",lessonTitle:title})});save();$("lessonmsg").textContent="Lesson saved. It is now available to students in Class "+cls+".";teacherPage("lessons")};
 }
 if(page==="words"){shell("teacher",page,"Vocabulary word manager",'<div class="panel"><div class="grid"><div><label>Subject</label>'+options("ws",subjects,"English")+'</div><div><label>Class</label>'+options("wc",["All",...classes],"6")+'</div><div><label>Level</label>'+options("wl",levels,"Beginner")+'</div></div>'+field("Word","word","Word or phrase")+field("Meaning / translation","meaning","Meaning")+field("Example sentence","example","Example")+field("Pronunciation hint","pron","Optional")+'<button id="addword">Save word</button><hr><h3>Word bank</h3><div class="scroll" id="wordtable"></div><button class="alt" id="exportwords">Export words CSV</button></div>');function refreshWords(){$("wordtable").innerHTML='<table><tr><th>Word</th><th>Subject / class</th><th>Meaning</th><th></th></tr>'+db.words.map(w=>'<tr><td>'+esc(w.word)+'</td><td>'+esc(w.subject)+' / '+esc(w.cls)+'</td><td>'+esc(w.meaning)+'</td><td><button class="danger" data-delete="'+w.id+'">Delete</button></td></tr>').join("")+'</table>';app.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{db.words=db.words.filter(w=>w.id!==+b.dataset.delete);save();refreshWords()})}refreshWords();$("addword").onclick=()=>{if(!val("word").trim()||!val("meaning").trim()){alert("Word and meaning are required.");return}db.words.push({id:db.next++,subject:val("ws"),cls:val("wc"),level:val("wl"),word:val("word").trim(),meaning:val("meaning").trim(),example:val("example"),pron:val("pron")});save();refreshWords();$("word").value=$("meaning").value=$("example").value=$("pron").value=""};$("exportwords").onclick=()=>downloadCSV("teresa-words.csv",[["subject","class","level","word","meaning","example","pronunciation"],...db.words.map(w=>[w.subject,w.cls,w.level,w.word,w.meaning,w.example,w.pron])])}
 if(page==="reports"){shell("teacher",page,"Progress reports",'<div class="panel scroll">'+(db.results.length?'<table><tr><th>Student</th><th>Class</th><th>Subject</th><th>Test</th><th>Score</th><th>Date</th></tr>'+db.results.slice().reverse().map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.cls+'</td><td>'+esc(r.subject)+'</td><td>'+esc(r.title)+'</td><td>'+r.score+'%</td><td>'+new Date(r.date).toLocaleDateString()+'</td></tr>').join("")+'</table>':"No test results yet.")+'</div><button id="exportresults">Export results CSV</button> <button class="alt" id="backup">Download backup</button><label>Restore backup</label><input type="file" id="restore" accept=".json">');$("exportresults").onclick=()=>downloadCSV("teresa-results.csv",[["student","class","subject","test","score","date"],...db.results.map(r=>[r.name,r.cls,r.subject,r.title,r.score,r.date])]);$("backup").onclick=backup;$("restore").onchange=restore}
}
function stat(label,n){return '<div class="panel"><p class="muted">'+label+'</p><div class="stat">'+n+'</div></div>'}
function studentPage(page){
 let s=student();if(!s){login();return}
 if(page==="home"){let rs=db.results.filter(r=>r.sid===s.id),avg=rs.length?Math.round(rs.reduce((a,r)=>a+r.score,0)/rs.length):0;shell("student",page,"Welcome, "+s.name,'<div class="grid"><div class="panel"><h3>📘 English</h3><p class="muted">Reading, listening, speaking and vocabulary.</p><button data-sub="English">Start</button></div><div class="panel"><h3>अ Hindi</h3><p class="muted">पठन, श्रवण, बोलना और शब्दावली।</p><button data-sub="Hindi">शुरू करें</button></div><div class="panel"><h3>ॐ Sanskrit</h3><p class="muted">पठन, श्रवण, उच्चारण और शब्दावली।</p><button data-sub="Sanskrit">आरम्भः</button></div></div><div class="grid">'+stat("Tests completed",rs.length)+stat("Average score",avg+"%")+stat("Class",s.cls)+'</div>');app.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{subject=b.dataset.sub;studentPage("learn")})}
 if(page==="learn"){shell("student",page,"Learning studios · Class "+s.cls,'<div class="panel"><div class="grid"><div><label>Subject</label>'+options("sub",subjects,subject)+'</div><div><label>Level</label>'+options("lev",levels,level)+'</div></div><div class="grid">'+[["📖","Reading"],["🎧","Listening"],["🎙️","Speaking & pronunciation"],["🔤","Vocabulary"],["📝","Final test"]].map(x=>'<div class="panel"><h3>'+x[0]+' '+x[1]+'</h3><button data-activity="'+x[1]+'">Start</button></div>').join("")+'</div><div id="activity"></div></div>');$("sub").onchange=()=>subject=val("sub");$("lev").onchange=()=>level=val("lev");app.querySelectorAll("[data-activity]").forEach(b=>b.onclick=()=>{currentAssignment=null;activity(b.dataset.activity)})}
 if(page==="words"){shell("student",page,"My vocabulary",'<div class="panel"><label>Subject</label>'+options("vsub",subjects,subject)+'<div id="vlist"></div></div>');function refresh(){subject=val("vsub");let ws=db.words.filter(w=>w.subject===subject&&(w.cls===s.cls||w.cls==="All"));$("vlist").innerHTML=ws.map(w=>'<div class="question"><b>'+esc(w.word)+'</b> <button class="alt" data-say="'+encodeURIComponent(w.word)+'">🔊 Hear</button><p>'+esc(w.meaning)+'</p><p class="muted">'+esc(w.example)+' · '+esc(w.pron)+'</p></div>').join("")||"No vocabulary for this class yet.";app.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>speak(decodeURIComponent(b.dataset.say),subject))}$("vsub").onchange=refresh;refresh()}
 if(page==="assign"){let as=db.assignments.filter(a=>a.cls===s.cls&&(a.target==="Entire class"||a.target===s.name+" (Class "+s.cls+")"));shell("student",page,"My assignments",'<div class="panel">'+(as.map(a=>'<div class="question"><b>'+esc(a.title)+'</b><p>'+esc(a.subject)+' · '+esc(a.activity)+' · '+esc(a.level)+'</p><button data-start="'+a.id+'">Start activity</button></div>').join("")||"No assignments yet.")+'</div>');app.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{let a=db.assignments.find(x=>x.id===+b.dataset.start);subject=a.subject;currentAssignment=a;level=a.level||"Beginner";shell("student","assign","Assignment: "+a.title, '<div class="panel"><p><b>'+esc(a.subject)+' · Class '+esc(a.cls)+' · '+esc(a.activity)+'</b></p><p class="muted">This is a teacher-assigned activity, separate from Learning studios.</p><button class="alt" id="backassign">← Back to my assignments</button><div id="activity"></div></div>');$("backassign").onclick=()=>{currentAssignment=null;studentPage("assign")};activity(a.activity)})}
 if(page==="reports"){let rs=db.results.filter(r=>r.sid===s.id),avg=rs.length?Math.round(rs.reduce((a,r)=>a+r.score,0)/rs.length):0;shell("student",page,"My progress",'<div class="grid">'+stat("Tests completed",rs.length)+stat("Average score",avg+"%")+'</div><div class="panel scroll"><h3>Test history</h3>'+(rs.length?'<table><tr><th>Date</th><th>Subject</th><th>Activity</th><th>Score</th></tr>'+rs.slice().reverse().map(r=>'<tr><td>'+new Date(r.date).toLocaleDateString()+'</td><td>'+esc(r.subject)+'</td><td>'+esc(r.title)+'</td><td>'+r.score+'%</td></tr>').join("")+'</table>':"Complete a test to see your scores.")+'</div>')}
}
function lessonFor(sub,cls){return db.lessons.find(l=>l.subject===sub&&String(l.cls)===String(cls))||null}
function activity(kind){
 subject=$("sub")?val("sub"):subject;level=$("lev")?val("lev"):level;let s=student(),box=$("activity");if(!box)return;
 let ws=db.words.filter(w=>w.subject===subject&&(w.cls===s.cls||w.cls==="All"));if(currentAssignment&&currentAssignment.words&&currentAssignment.words.length){ws=currentAssignment.words.map((word,i)=>({id:"assignment-"+i,subject,cls:s.cls,word,meaning:"Teacher-assigned practice",example:"",pron:""}))}let lesson=lessonFor(subject,s.cls);if(currentAssignment&&currentAssignment.content){lesson={...(lesson||{title:currentAssignment.title,qs:[["What is the main idea of this passage?",["The passage above","A different topic","Not mentioned"],0]]}),title:currentAssignment.title,passage:currentAssignment.content,qs:(lesson&&lesson.qs)||[["What is the main idea of this passage?",["The passage above","A different topic","Not mentioned"],0]]};}
 if(kind==="Vocabulary"){box.innerHTML='<div class="panel"><h3>'+subject+' vocabulary</h3>'+(ws.map(w=>'<div class="question"><b>'+esc(w.word)+'</b> <button class="alt" data-audio="'+encodeURIComponent(w.word)+'">🔊 Hear</button><p>'+esc(w.meaning)+'</p><p class="muted">'+esc(w.example)+' · '+esc(w.pron)+'</p></div>').join("")||"No words added for this class yet.")+'</div>';app.querySelectorAll("[data-audio]").forEach(b=>b.onclick=()=>speak(decodeURIComponent(b.dataset.audio),subject));return}
 if(kind==="Speaking & pronunciation"||kind==="Speaking"){
 if(!ws.length){box.innerHTML='<div class="panel">No speaking words are available for Class '+esc(s.cls)+' in '+esc(subject)+'. Ask your teacher to add words in Lesson editor or include target words in this assignment.</div>';return}
 let wi=0,rec=null;const drawWord=()=>{let w=ws[wi];box.innerHTML='<div class="panel"><h3>Speaking and pronunciation</h3><p class="muted">Word '+(wi+1)+' of '+ws.length+(currentAssignment?' · Teacher assignment':' · Learning studio')+'</p><div class="passage" style="font-size:25px"><b>'+esc(w.word)+'</b><p style="font-size:15px">'+esc(w.meaning||'')+'</p><span class="muted">'+esc(w.pron||'')+'</span></div><button id="model">🔊 Hear model</button> <button id="speakcheck">🎙️ Start speaking check</button> <button class="alt" id="stopcheck">Stop microphone</button> '+(ws.length>1?'<button class="alt" id="nextword">Next word →</button>':'')+'<p id="heard" class="question">Recognised speech will appear here.</p><p id="practiceMsg" class="muted">Say the target word into your microphone. Recognition depends on browser support and may require internet.</p></div>';
 const norm=x=>String(x||'').toLocaleLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\p{L}\p{N}]+/gu,'').trim();
 $("model").onclick=()=>speak(w.word,subject);$("speakcheck").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("practiceMsg").textContent='Speech recognition is not supported here. Try an updated Chrome browser and check microphone permission.';return}try{rec=new SR();rec.lang=subject==='English'?'en-IN':'hi-IN';rec.interimResults=false;rec.maxAlternatives=3;$("practiceMsg").textContent='Listening… say the word now.';rec.onresult=e=>{let alternatives=Array.from(e.results[0]).map(a=>a.transcript),heard=alternatives[0]||'';$("heard").innerHTML='<b>You said:</b> '+esc(heard);let match=alternatives.some(a=>norm(a)===norm(w.word));$("practiceMsg").textContent=match?'✅ Correct — the app recognised “'+w.word+'”.':'❌ The app heard “'+heard+'”, not the target “'+w.word+'”. Try again.';if(match){db.results.push({sid:s.id,name:s.name,cls:s.cls,subject,score:100,title:(currentAssignment?'Assignment: '+currentAssignment.title+' — ':'Learning studio: ')+'Speaking — '+w.word,date:new Date().toISOString()});save()}};rec.onerror=e=>$("practiceMsg").textContent='Microphone / recognition error: '+e.error+'. Check microphone permission and browser support.';rec.start()}catch(e){$("practiceMsg").textContent='Could not start microphone. Check permission and try again.'}};$("stopcheck").onclick=()=>{if(rec)try{rec.stop()}catch(e){}$("practiceMsg").textContent='Microphone stopped.'};if($("nextword"))$("nextword").onclick=()=>{if(rec)try{rec.stop()}catch(e){}wi=(wi+1)%ws.length;drawWord()};};drawWord();return}

 if(!lesson){box.innerHTML='<div class="panel">No sample lesson for this subject yet. Ask your teacher to add vocabulary words; the reading content can be added in a future content editor.</div>';return}
 if(kind==="Reading"||kind==="Listening"||kind==="Final test"){
 let qs=lesson.qs.slice();if(kind==="Final test")ws.slice(0,2).forEach(w=>{let opts=[w.meaning,...ws.filter(x=>x.id!==w.id).slice(0,2).map(x=>x.meaning)];while(opts.length<3)opts.push("Not sure");qs.push(["What does “"+w.word+"” mean?",opts,0])});
 box.innerHTML='<div class="panel"><h3>'+esc(lesson.title)+' · '+kind+'</h3>'+(kind==="Reading"?'<div class="passage">'+esc(lesson.passage)+'</div>':kind==="Listening"?'<p class="muted">Listen to the passage, then answer the questions.</p><button id="play">🔊 Play passage</button>':'<p class="muted">Answer every question, then submit your test.</p>')+qs.map((q,i)=>'<div class="question"><b>'+(i+1)+'. '+esc(q[0])+'</b>'+q[1].map((o,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+j+'">'+esc(o)+'</label>').join("")+'</div>').join("")+'<button id="submit">Submit '+(kind==="Final test"?"test":"answers")+'</button><div id="score"></div></div>';
 if(kind==="Listening")$("play").onclick=()=>speak(lesson.passage,subject);
 $("submit").onclick=()=>{let correct=0;qs.forEach((q,i)=>{let a=app.querySelector('input[name="q'+i+'"]:checked');if(a&&+a.value===q[2])correct++});let score=Math.round(correct/qs.length*100);db.results.push({sid:s.id,name:s.name,cls:s.cls,subject,score,title:kind+" — "+lesson.title,date:new Date().toISOString()});save();$("score").innerHTML='<div class="notice" style="background:#e7f8ee">Score: <b>'+score+'%</b> ('+correct+'/'+qs.length+'). Result saved to your progress.</div>';};return}
}
function speak(text,sub){if(!("speechSynthesis"in window)){alert("Text-to-speech is not available in this browser. You can still read and practise offline.");return}window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang=sub==="English"?"en-IN":"hi-IN";window.speechSynthesis.speak(u)}
function downloadCSV(name,rows){let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="teresa-language-lab-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.students)||!Array.isArray(d.words)||!Array.isArray(d.results)||!Array.isArray(d.assignments))throw Error();db=d;save();alert("Backup restored.");teacherPage("reports")}catch(x){alert("This backup file is invalid.")}};r.readAsText(f)}
login();
})();
